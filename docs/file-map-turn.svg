<!-- ENTRY -->
<rect x="235" y="80" width="200" height="44" rx="8" fill="#F1F3F7" stroke="#9AA3B2"/>
<text x="335" y="100" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3A4152">cli.py</text>
<text x="335" y="116" text-anchor="middle" font-size="10" fill="#7A8296">โหมด terminal</text>
<rect x="525" y="80" width="200" height="44" rx="8" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="625" y="100" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E4FC0">app.py</text>
<text x="625" y="116" text-anchor="middle" font-size="10" fill="#4A6FBF">เว็บ Streamlit (การ์ด + รูป)</text>

<!-- ORCHESTRATOR -->
<rect x="300" y="152" width="360" height="60" rx="9" fill="#EEEBFF" stroke="#6C5CE7" stroke-width="1.6"/>
<text x="480" y="176" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3A2E9E">agent.py — Orchestrator (ProductRecAgent)</text>
<text x="480" y="196" text-anchor="middle" font-size="10.5" fill="#5B4FC0">respond(): เรียกลูกทีมตามลำดับ · ⑤ Generator + prompts อยู่ในไฟล์นี้</text>

<!-- STAGES -->
<rect x="30" y="250" width="210" height="88" rx="8" fill="#E4F5F0" stroke="#12A594" stroke-width="1.4"/>
<text x="135" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0C7A6E">memory.py</text>
<text x="135" y="298" text-anchor="middle" font-size="10.5" fill="#2C2C2A">จดโน้ต profile</text>
<text x="135" y="325" text-anchor="middle" font-size="9.5" font-style="italic" fill="#12A594">EXTRACT_SYSTEM</text>
