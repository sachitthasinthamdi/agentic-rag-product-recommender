<!-- legend -->
<rect x="520" y="612" width="410" height="126" rx="9" fill="#F7F9FE" stroke="#C7D6F2"/>
<text x="536" y="632" font-size="11.5" font-weight="700" fill="#1E4FC0">ลำดับ 1 turn (recommend)</text>
<text x="536" y="651" font-size="10.5" fill="#2C2C2A">① app→agent   ② agent→memory   ③ memory→llm→AI</text>
<text x="536" y="669" font-size="10.5" fill="#2C2C2A">④ agent→planner   ⑤ planner→llm→AI   ⑥ agent→retriever</text>
<text x="536" y="687" font-size="10.5" fill="#2C2C2A">⑦ retriever→catalog→ChromaDB (+bge-m3)   ⑧ agent→reranker→llm</text>
<text x="536" y="705" font-size="10.5" fill="#2C2C2A">⑨ agent→llm เขียนคำตอบ (Generator)</text>
<text x="536" y="726" font-size="10" font-style="italic" fill="#7A8296">↩ ทุกขั้นเด้งกลับ agent ก่อนไปขั้นถัดไป (ไม่วาดเส้นย้อน)</text>

