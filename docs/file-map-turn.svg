<text x="365" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A2E9E">planner.py</text>
<text x="365" y="298" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ask / recommend / chat</text>
<text x="365" y="325" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6C5CE7">PLAN_SYSTEM</text>
<rect x="490" y="250" width="210" height="88" rx="8" fill="#FBEFD9" stroke="#E8930C" stroke-width="1.4"/>
<text x="595" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9A6206">retriever.py</text>
<text x="595" y="298" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ค้น + กรองงบ</text>
<text x="595" y="325" text-anchor="middle" font-size="9.5" font-style="italic" fill="#E8930C">ใช้ bge-m3</text>
<rect x="720" y="250" width="210" height="88" rx="8" fill="#FCE9E5" stroke="#FF6B57" stroke-width="1.4"/>
<text x="825" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C13B29">reranker.py</text>
<text x="825" y="298" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ให้คะแนน 0–10</text>
<text x="825" y="325" text-anchor="middle" font-size="9.5" font-style="italic" fill="#FF6B57">RERANK_SYSTEM</text>

<!-- FOUNDATION -->
<rect x="100" y="385" width="220" height="86" rx="8" fill="#FBF4E7" stroke="#BA8B2E" stroke-width="1.4"/>
<text x="210" y="414" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8A6420">catalog.py</text>
<text x="210" y="436" text-anchor="middle" font-size="10.5" fill="#2C2C2A">get_collection → ChromaDB</text>
<text x="210" y="457" text-anchor="middle" font-size="9.5" font-style="italic" fill="#BA8B2E">load_products / build_index</text>
<rect x="385" y="385" width="220" height="86" rx="9" fill="#DFF3EF" stroke="#12A594" stroke-width="2.4"/>
<text x="495" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#0C7A6E">★ llm.py</text>
<text x="495" y="435" text-anchor="middle" font-size="10.5" fill="#2C2C2A">chat · chat_json · embed</text>
<text x="495" y="456" text-anchor="middle" font-size="9.5" font-style="italic" fill="#12A594">ประตูเดียวสู่ AI</text>
<rect x="670" y="385" width="200" height="86" rx="8" fill="#F1F3F7" stroke="#9AA3B2" stroke-width="1.4"/>
<text x="770" y="414" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A4152">config.py</text>
<text x="770" y="436" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ค่ากลาง: โมเดล · k · path</text>
<text x="770" y="457" text-anchor="middle" font-size="9.5" fill="#7A8296">(ทุกโมดูลอ่านค่า)</text>

<!-- EXTERNAL -->
<rect x="55" y="520" width="210" height="84" rx="8" fill="#F7F6F2" stroke="#9AA3B2" stroke-dasharray="5 3" stroke-width="1.3"/>
<text x="160" y="548" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5F5E5A">ChromaDB · .chroma/</text>
<text x="160" y="570" text-anchor="middle" font-size="10.5" fill="#5F5E5A">Vector DB (1,800 สินค้า)</text>
<rect x="285" y="520" width="210" height="84" rx="8" fill="#F7F6F2" stroke="#9AA3B2" stroke-dasharray="5 3" stroke-width="1.3"/>
<text x="390" y="548" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5F5E5A">data/products.json</text>
<text x="390" y="570" text-anchor="middle" font-size="10.5" fill="#5F5E5A">แคตตาล็อก + รูป</text>
<rect x="520" y="520" width="300" height="84" rx="8" fill="#F7F6F2" stroke="#9AA3B2" stroke-dasharray="5 3" stroke-width="1.3"/>
<text x="670" y="548" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5F5E5A">Ollama (ภายนอก)</text>
<text x="670" y="570" text-anchor="middle" font-size="10.5" fill="#5F5E5A">Typhoon2 8B (chat) · bge-m3 (embed)</text>
<text x="670" y="590" text-anchor="middle" font-size="9.5" font-style="italic" fill="#2563EB">🔵 เรียก AI หลายครั้ง/turn (③⑤⑦⑧⑨)</text>
<rect x="285" y="660" width="210" height="42" rx="8" fill="#FFFFFF" stroke="#BA8B2E" stroke-dasharray="5 3" stroke-width="1.3"/>
<text x="390" y="678" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8A6420">data/build_products.py</text>
<text x="390" y="693" text-anchor="middle" font-size="9.5" fill="#7A8296">stream Amazon → สร้าง (ครั้งเดียว)</text>

