<svg viewBox="0 0 980 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="แผนผังไฟล์ พร้อมลำดับ 1 turn">
<title>file-map + ลำดับการทำงาน 1 turn</title>
<desc>แผนผังความเชื่อมโยงไฟล์ ไฮไลต์เส้นทางการเรียกจริง 1 turn ด้วยเลข 1 ถึง 9</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B0B7C4"/></marker>
<marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9BE95"/></marker>
<marker id="fb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
</defs>
<rect x="2" y="2" width="976" height="756" rx="14" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1.5"/>
<text x="26" y="34" font-size="19" font-weight="600" fill="#22262F">แผนผังไฟล์ + ลำดับการทำงาน 1 turn</text>
<text x="26" y="55" font-size="11.5" fill="#7A8296">🔵 เส้นน้ำเงิน + เลข ①–⑨ = เส้นทางที่เดินจริงตอน respond() (recommend) · เทา = โครงสร้างที่ไม่ได้เดินรอบนี้</text>

