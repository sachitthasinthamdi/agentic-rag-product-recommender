<svg viewBox="0 0 920 770" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="แผนภาพสถาปัตยกรรมระบบแนะนำหนังน้องมูฟวี่">
