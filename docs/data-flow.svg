<rect x="150" y="536" width="320" height="30" rx="7" fill="#FAEEDA" stroke="#BA7517"/>
<text x="310" y="555" text-anchor="middle" font-size="10.5" font-weight="500" fill="#854F0B">⑤ Generator — context → LLM เขียน (ground)</text>
<line x1="310" y1="566" x2="310" y2="580" stroke="#9A9992" stroke-width="1.4" marker-end="url(#d)"/>
<rect x="30" y="580" width="560" height="52" rx="7" fill="#EAF3DE" stroke="#639922"/>
<text x="44" y="598" font-size="10" font-weight="500" fill="#3B6D11">OUTPUT · text (+ การ์ดสินค้า)</text>
<text x="44" y="616" font-size="11" fill="#173404">"1. Galaxy A11 Case — $3.99 · TSXUAN — กันกระแทก ราคาในงบ ตรงที่ขอ..."</text>
