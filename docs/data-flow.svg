<svg viewBox="0 0 620 648" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="การไหลของข้อมูลใน pipeline (สินค้า)">
<title>Data flow — ข้อมูลเปลี่ยนรูปผ่าน 5 ขั้น (โดเมนสินค้า)</title>
<desc>ข้อความผู้ใช้ไหลผ่าน Memory Planner Retriever Reranker Generator เปลี่ยนจาก text เป็น JSON เป็น list เป็น text พร้อมกรองงบ</desc>
<defs><marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9A9992"/></marker></defs>
<rect x="2" y="2" width="616" height="644" rx="14" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1.5"/>
<text x="24" y="32" font-size="18" font-weight="500" fill="#2C2C2A">การไหลของข้อมูลใน Pipeline (สินค้า)</text>
<text x="24" y="53" font-size="11" fill="#7A7972">ตัวอย่างจริง "หาเคสมือถือกันกระแทก งบไม่เกิน 15" · กล่องเทา = ข้อมูล · กล่องสี = ขั้นที่แปลง</text>
<rect x="30" y="70" width="560" height="44" rx="7" fill="#F7F6F2" stroke="#D3D1C7"/>
