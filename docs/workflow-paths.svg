<text x="24" y="55" font-size="11.5" fill="#7A7972">Orchestrator เริ่มทุก turn ด้วย Memory → Planner แล้วเลือก 1 ใน 3 (ยิ่งงานหนัก ยิ่งยาว/ช้า)</text>

