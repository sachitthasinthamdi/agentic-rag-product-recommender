<rect x="24" y="326" width="792" height="82" rx="8" fill="#FBFAF7" stroke="#E5E3DC"/>
<text x="40" y="346" font-size="12" font-weight="500" fill="#444441">Multi-turn: ต่อ workflow กันเป็นบทสนทนา (Memory จำ context ทุก turn)</text>
<text x="40" y="366" font-size="10.5" fill="#5F5E5A">• เริ่มกำกวม: ask → ask → recommend    • ปฏิเสธ: recommend → recommend (กรองเรื่องเดิม)</text>
<text x="40" y="384" font-size="10.5" fill="#5F5E5A">• เปลี่ยนใจ: recommend → recommend (profile ใหม่)    • ถามแทรก: recommend → chat → recommend</text>
<text x="40" y="402" font-size="10.5" fill="#7A7972">แก่น: โมเดล (Typhoon2) ตัวเดียวสวมหลายบทบาท · โค้ด (Orchestrator) คุมว่าเดินเส้นไหน</text>
