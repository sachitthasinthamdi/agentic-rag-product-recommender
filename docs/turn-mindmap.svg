<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="mindmap 1 turn จำง่าย">
<title>Mindmap — 1 turn ทำงานยังไง (จำง่าย)</title>
<desc>สรุปแผนผังไฟล์ + ลำดับการทำงาน 1 turn แบบเข้าใจง่าย agent สั่ง 5 ขั้น ทุกขั้นผ่าน llm</desc>
<rect x="2" y="2" width="1196" height="696" rx="14" fill="#FDFDFC" stroke="#E5E3DC" stroke-width="1.5"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#22262F">🧠 1 turn ทำงานยังไง + ไฟล์ไหนทำอะไร</text>
<text x="30" y="58" font-size="12" fill="#7A8296">อ่านซ้าย → ขวา: ผู้ใช้พิมพ์ → agent.py สั่งลูกทีม ① → ⑤ → ตอบ (ทุกขั้นเด้งกลับ agent)</text>

<!-- arrows -->
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA3B2"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#12A594"/></marker></defs>
<g stroke="#9AA3B2" stroke-width="1.6" fill="none">
<path d="M155 128 L155 148" marker-end="url(#m)"/>
<path d="M1045 150 L1045 130" marker-end="url(#m)"/>
<path d="M148 210 L148 242" marker-end="url(#m)"/>
<path d="M374 210 L374 242" marker-end="url(#m)"/>
<path d="M600 210 L600 242" marker-end="url(#m)"/>
<path d="M826 210 L826 242" marker-end="url(#m)"/>
<path d="M1052 210 L1052 242" marker-end="url(#m)"/>
</g>
<g stroke="#12A594" stroke-width="1.3" fill="none" stroke-dasharray="3 3">
<path d="M148 422 L148 440" marker-end="url(#mb)"/>
<path d="M374 422 L374 440" marker-end="url(#mb)"/>
<path d="M600 422 L600 440" marker-end="url(#mb)"/>
<path d="M826 422 L826 440" marker-end="url(#mb)"/>
<path d="M1052 422 L1052 440" marker-end="url(#mb)"/>
</g>

<!-- IN / OUT -->
<rect x="40" y="76" width="230" height="52" rx="9" fill="#F1F3F7" stroke="#9AA3B2"/>
<text x="155" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A4152">📱 app.py / cli.py</text>
<text x="155" y="118" text-anchor="middle" font-size="10.5" fill="#7A8296">ผู้ใช้พิมพ์ → respond()</text>
<rect x="930" y="76" width="230" height="52" rx="9" fill="#E6F5EC" stroke="#2E9E6B"/>
<text x="1045" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1C6E47">💬 คำตอบ + การ์ด</text>
<text x="1045" y="118" text-anchor="middle" font-size="10.5" fill="#3B7355">รูป · ราคา · เหตุผล</text>

<!-- AGENT banner -->
<rect x="40" y="150" width="1120" height="58" rx="10" fill="#EEEBFF" stroke="#6C5CE7" stroke-width="1.8"/>
<text x="600" y="176" text-anchor="middle" font-size="16" font-weight="800" fill="#3A2E9E">🎬 agent.py — ตัวคุมงาน (respond)</text>
<text x="600" y="196" text-anchor="middle" font-size="12" fill="#5B4FC0">เรียกลูกทีมทีละคน ① → ⑤ · ถือข้อมูลส่งต่อ · เด้งกลับที่นี่ทุกครั้ง</text>

<!-- 5 STAGE CARDS -->
<!-- 1 memory -->
<rect x="40" y="242" width="216" height="180" rx="11" fill="#E4F5F0" stroke="#12A594" stroke-width="1.5"/>
<circle cx="62" cy="266" r="15" fill="#12A594"/><text x="62" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">1</text>
<text x="86" y="271" font-size="14" font-weight="700" fill="#0C7A6E">memory.py</text>
<text x="60" y="316" font-size="19" font-weight="800" fill="#243244">จดโน้ต</text>
<text x="60" y="342" font-size="11" fill="#5C6B7A">สกัดความต้องการ</text>
<text x="60" y="378" font-size="13" font-weight="700" fill="#0C7A6E">→ profile</text>
<text x="60" y="398" font-size="10.5" fill="#5C6B7A">{หมวด, งบ, ฟีเจอร์}</text>

<!-- 2 planner -->
<rect x="266" y="242" width="216" height="180" rx="11" fill="#ECEAFB" stroke="#6C5CE7" stroke-width="1.5"/>
<circle cx="288" cy="266" r="15" fill="#6C5CE7"/><text x="288" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">2</text>
<text x="312" y="271" font-size="14" font-weight="700" fill="#3A2E9E">planner.py</text>
<text x="286" y="316" font-size="19" font-weight="800" fill="#243244">คิด</text>
<text x="286" y="342" font-size="11" fill="#5C6B7A">ตัดสินใจว่าจะทำอะไร</text>
<text x="286" y="378" font-size="13" font-weight="700" fill="#3A2E9E">→ action</text>
<text x="286" y="398" font-size="10.5" fill="#5C6B7A">ask / recommend / chat</text>

<!-- 3 retriever -->
<rect x="492" y="242" width="216" height="180" rx="11" fill="#FBEFD9" stroke="#E8930C" stroke-width="1.5"/>
<circle cx="514" cy="266" r="15" fill="#E8930C"/><text x="514" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">3</text>
<text x="538" y="271" font-size="14" font-weight="700" fill="#9A6206">retriever.py</text>
<text x="512" y="316" font-size="19" font-weight="800" fill="#243244">หาของ</text>
<text x="512" y="342" font-size="11" fill="#5C6B7A">ค้น + กรองงบ (≤ งบ)</text>
<text x="512" y="378" font-size="13" font-weight="700" fill="#9A6206">→ 10 ชิ้น</text>
<text x="512" y="398" font-size="10.5" fill="#5C6B7A">ทุกชิ้นอยู่ในงบ</text>

<!-- 4 reranker -->
<rect x="718" y="242" width="216" height="180" rx="11" fill="#FCE9E5" stroke="#FF6B57" stroke-width="1.5"/>
<circle cx="740" cy="266" r="15" fill="#FF6B57"/><text x="740" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">4</text>
<text x="764" y="271" font-size="14" font-weight="700" fill="#C13B29">reranker.py</text>
<text x="738" y="316" font-size="19" font-weight="800" fill="#243244">คัด</text>
<text x="738" y="342" font-size="11" fill="#5C6B7A">ให้คะแนน 0–10</text>
<text x="738" y="378" font-size="13" font-weight="700" fill="#C13B29">→ 3 ชิ้น</text>
<text x="738" y="398" font-size="10.5" fill="#5C6B7A">ตรงใจที่สุด</text>

<!-- 5 generator -->
<rect x="944" y="242" width="216" height="180" rx="11" fill="#E6F5EC" stroke="#2E9E6B" stroke-width="1.5"/>
<circle cx="966" cy="266" r="15" fill="#2E9E6B"/><text x="966" y="271" text-anchor="middle" font-size="15" font-weight="700" fill="#FFF">5</text>
<text x="990" y="271" font-size="14" font-weight="700" fill="#1C6E47">Generator</text>
<text x="964" y="316" font-size="19" font-weight="800" fill="#243244">เขียน</text>
<text x="964" y="342" font-size="11" fill="#5C6B7A">(อยู่ใน agent.py)</text>
<text x="964" y="378" font-size="13" font-weight="700" fill="#1C6E47">→ คำตอบ</text>
<text x="964" y="398" font-size="10.5" fill="#5C6B7A">ground กับของจริง</text>

<!-- LLM bar -->
<rect x="40" y="440" width="1120" height="56" rx="10" fill="#DFF3EF" stroke="#12A594" stroke-width="1.8"/>
<text x="600" y="465" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0C7A6E">🧠 llm.py = ประตูเดียวสู่ AI → Ollama</text>
<text x="600" y="484" text-anchor="middle" font-size="11.5" fill="#2C2C2A">☎️ Typhoon2 คุย 4 ครั้ง (①②④⑤) · 🔢 bge-m3 + ChromaDB (③) · ตอบพังก็มี fallback ไม่ล่ม</text>

<!-- mnemonic -->
<rect x="40" y="518" width="1120" height="150" rx="12" fill="#F7F9FE" stroke="#C7D6F2"/>
<text x="600" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#1E4FC0">จำง่าย 5 คำ</text>
<text x="600" y="602" text-anchor="middle" font-size="30" font-weight="800">
<tspan fill="#12A594">จด</tspan><tspan fill="#8A93A6"> → </tspan><tspan fill="#6C5CE7">คิด</tspan><tspan fill="#8A93A6"> → </tspan><tspan fill="#E8930C">หา</tspan><tspan fill="#8A93A6"> → </tspan><tspan fill="#FF6B57">คัด</tspan><tspan fill="#8A93A6"> → </tspan><tspan fill="#2E9E6B">เขียน</tspan></text>
<text x="600" y="636" text-anchor="middle" font-size="12.5" fill="#5C6B7A">memory → planner → retriever → reranker → generator</text>
<text x="600" y="657" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7A8296">agent.py คุมทุกขั้น · ทุกครั้งที่คุย AI ต้องผ่าน llm.py (ประตูเดียว)</text>
</svg>
