<svg viewBox="0 0 980 812" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="การไหลของข้อมูล 1 turn">
<title>การไหลของข้อมูล 1 turn — respond()</title>
<desc>ลำดับการเรียกจริงตอน respond ทำงาน หนึ่ง turn เส้นทาง recommend พร้อมข้อมูลที่ส่งต่อ</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A93A6"/></marker></defs>
<rect x="2" y="2" width="976" height="808" rx="14" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1.5"/>
<text x="26" y="34" font-size="19" font-weight="600" fill="#22262F">การไหลของข้อมูล 1 turn — agent.respond()</text>
<text x="26" y="55" font-size="11.5" fill="#7A8296">ตัวอย่าง: "หาหูฟังมีสายไว้เล่นเกม งบ 40" · เส้นทาง recommend · กล่องขวา = ข้อมูลที่ได้ ส่งต่อขั้นถัดไป</text>
<text x="720" y="34" font-size="10.5" fill="#8A93A6">🟢 = เรียก AI (Typhoon2/bge-m3)</text>

<!-- down arrows spine -->
<g stroke="#8A93A6" stroke-width="1.6" fill="none">
<path d="M154 148 L154 168" marker-end="url(#a)"/>
<path d="M154 234 L154 254" marker-end="url(#a)"/>
<path d="M154 320 L154 340" marker-end="url(#a)"/>
<path d="M154 406 L154 426" marker-end="url(#a)"/>
<path d="M154 492 L154 512" marker-end="url(#a)"/>
<path d="M154 578 L154 598" marker-end="url(#a)"/>
<path d="M154 664 L154 684" marker-end="url(#a)"/>
</g>

<!-- STEP template rows -->
<!-- 1 INPUT -->
<g><rect x="40" y="84" width="900" height="64" rx="9" fill="#F1F3F7" stroke="#9AA3B2" stroke-width="1.3"/>
<circle cx="70" cy="116" r="15" fill="#6A7488"/><text x="70" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">0</text>
<text x="100" y="110" font-size="13.5" font-weight="700" fill="#3A4152">INPUT — respond(user_message)</text>
<text x="100" y="132" font-size="10.5" fill="#7A8296">ผู้ใช้พิมพ์ข้อความเข้ามา</text>
<line x1="560" y1="94" x2="560" y2="138" stroke="#D8DCE4"/>
<text x="578" y="120" font-size="12" fill="#2C2C2A">"หาหูฟังมีสายไว้เล่นเกม งบ 40"</text></g>

<!-- 2 memory -->
<g><rect x="40" y="170" width="900" height="64" rx="9" fill="#E4F5F0" stroke="#12A594" stroke-width="1.4"/>
<circle cx="70" cy="202" r="15" fill="#12A594"/><text x="70" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">1</text>
<text x="100" y="196" font-size="13.5" font-weight="700" fill="#0C7A6E">memory.update_profile(msg, ประวัติ)</text>
<text x="100" y="218" font-size="10" font-style="italic" fill="#0C7A6E">🟢 Typhoon2 · chat_json (EXTRACT_SYSTEM · temp 0.1)</text>
<line x1="560" y1="180" x2="560" y2="224" stroke="#BFE6DE"/>
<text x="578" y="199" font-size="11" fill="#5F5E5A">→ profile (JSON)</text>
<text x="578" y="218" font-size="10.5" fill="#2C2C2A">{หมวด:หูฟัง, งบ:40, ฟีเจอร์:[มีสาย], ใช้:เล่นเกม}</text></g>

<!-- 3 planner -->
<g><rect x="40" y="256" width="900" height="64" rx="9" fill="#ECEAFB" stroke="#6C5CE7" stroke-width="1.4"/>
<circle cx="70" cy="288" r="15" fill="#6C5CE7"/><text x="70" y="293" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">2</text>
<text x="100" y="282" font-size="13.5" font-weight="700" fill="#3A2E9E">planner.decide(profile, ประวัติ, msg, ask_count)</text>
<text x="100" y="304" font-size="10" font-style="italic" fill="#3A2E9E">🟢 Typhoon2 · chat_json (PLAN_SYSTEM · temp 0.1)</text>
<line x1="560" y1="266" x2="560" y2="310" stroke="#D6D1F5"/>
<text x="578" y="285" font-size="11" fill="#5F5E5A">→ action</text>
<text x="578" y="304" font-size="12.5" font-weight="600" fill="#2C2C2A">"recommend"  → เดินต่อขั้น 3–5</text></g>

<!-- 4 retriever -->
<g><rect x="40" y="342" width="900" height="64" rx="9" fill="#FBEFD9" stroke="#E8930C" stroke-width="1.4"/>
<circle cx="70" cy="374" r="15" fill="#E8930C"/><text x="70" y="379" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">3</text>
<text x="100" y="368" font-size="13.5" font-weight="700" fill="#9A6206">retriever.retrieve(query, exclude, budget)</text>
<text x="100" y="390" font-size="10" font-style="italic" fill="#9A6206">🟢 bge-m3 embed → ChromaDB query (where price ≤ 40)</text>
<line x1="560" y1="352" x2="560" y2="396" stroke="#F0DBB0"/>
<text x="578" y="371" font-size="11" fill="#5F5E5A">→ candidates ×10</text>
<text x="578" y="390" font-size="10.5" fill="#2C2C2A">ทุกชิ้น price ≤ 40 · ตัดของที่ปฏิเสธออก</text></g>

<!-- 5 reranker -->
<g><rect x="40" y="428" width="900" height="64" rx="9" fill="#FCE9E5" stroke="#FF6B57" stroke-width="1.4"/>
<circle cx="70" cy="460" r="15" fill="#FF6B57"/><text x="70" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">4</text>
<text x="100" y="454" font-size="13.5" font-weight="700" fill="#C13B29">reranker.rerank(candidates, profile, msg)</text>
<text x="100" y="476" font-size="10" font-style="italic" fill="#C13B29">🟢 Typhoon2 · chat_json (RERANK_SYSTEM · ให้คะแนน 0–10)</text>
<line x1="560" y1="438" x2="560" y2="482" stroke="#F6D2CB"/>
<text x="578" y="457" font-size="11" fill="#5F5E5A">→ picked ×3</text>
<text x="578" y="476" font-size="10.5" fill="#2C2C2A">+ fit_score + fit_reason (ตัดคะแนน &lt; 3 ทิ้ง)</text></g>

<!-- 6 generator -->
<g><rect x="40" y="514" width="900" height="64" rx="9" fill="#E6F5EC" stroke="#2E9E6B" stroke-width="1.4"/>
<circle cx="70" cy="546" r="15" fill="#2E9E6B"/><text x="70" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">5</text>
<text x="100" y="540" font-size="13.5" font-weight="700" fill="#1C6E47">llm.chat(ประวัติ + context 3 ชิ้น)</text>
<text x="100" y="562" font-size="10" font-style="italic" fill="#1C6E47">🟢 Typhoon2 · chat (RECOMMEND_SYSTEM · temp 0.7) — ground กับของจริง</text>
<line x1="560" y1="524" x2="560" y2="568" stroke="#C6E7D2"/>
<text x="578" y="543" font-size="11" fill="#5F5E5A">→ reply (ข้อความไทย)</text>
<text x="578" y="562" font-size="10.5" fill="#2C2C2A">"1. Adesso Headset — $11.97 · เหตุผล..."</text></g>

<!-- 7 memory save -->
<g><rect x="40" y="600" width="900" height="64" rx="9" fill="#F1F3F7" stroke="#9AA3B2" stroke-width="1.3"/>
<circle cx="70" cy="632" r="15" fill="#6A7488"/><text x="70" y="637" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">6</text>
<text x="100" y="626" font-size="13.5" font-weight="700" fill="#3A4152">memory.add("user") + memory.add("assistant")</text>
<text x="100" y="648" font-size="10" font-style="italic" fill="#7A8296">บันทึกลง history (RAM) · last_recommendations = ชื่อ 3 ชิ้น</text>
<line x1="560" y1="610" x2="560" y2="654" stroke="#D8DCE4"/>
<text x="578" y="635" font-size="10.5" fill="#2C2C2A">history += (user, assistant) → ใช้รอบถัดไป</text></g>

<!-- 8 return -->
<g><rect x="40" y="686" width="900" height="64" rx="9" fill="#E9E7FA" stroke="#3A2E9E" stroke-width="1.4"/>
<circle cx="70" cy="718" r="15" fill="#3A2E9E"/><text x="70" y="723" text-anchor="middle" font-size="14" font-weight="700" fill="#FFF">7</text>
<text x="100" y="712" font-size="13.5" font-weight="700" fill="#2A2072">return trace → หน้าบ้าน (cli / app)</text>
<text x="100" y="734" font-size="10" font-style="italic" fill="#2A2072">{reply, action, profile, candidates, picked, query, ...}</text>
<line x1="560" y1="696" x2="560" y2="740" stroke="#D2CEF3"/>
<text x="578" y="721" font-size="10.5" fill="#2C2C2A">app.py วาด: คำตอบ + การ์ดสินค้า (รูป/ราคา) + side panel</text></g>

<!-- branch note -->
<text x="26" y="774" font-size="10.5" fill="#7A8296">◇ ทางแยกที่ขั้น 2: ถ้า action = <tspan font-weight="700" fill="#3A2E9E">ask</tspan> → ถาม 1 คำถาม (ข้าม 3–5) · = <tspan font-weight="700" fill="#0C447C">chat</tspan> → ค้นเบา 3 ชิ้น แล้วตอบ · <tspan fill="#C13B29">recommend เท่านั้นที่เดินครบ pipeline (เรียก AI 4 ครั้ง ≈ 14 วิ)</tspan></text>
<text x="26" y="794" font-size="10.5" fill="#9AA3B2">agent.respond() เป็นตัวเรียกทุกขั้นตามลำดับนี้ · โมดูลอื่นไม่เรียกกันเองข้ามขั้น</text>
</svg>
