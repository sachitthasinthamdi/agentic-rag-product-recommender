<text x="135" y="309" text-anchor="middle" font-size="10.5" fill="#2C2C2A">SessionMemory + history</text>
<text x="135" y="327" text-anchor="middle" font-size="9.5" font-style="italic" fill="#12A594">EXTRACT_SYSTEM</text>

<rect x="260" y="250" width="210" height="88" rx="8" fill="#ECEAFB" stroke="#6C5CE7" stroke-width="1.4"/>
<text x="365" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3A2E9E">② planner.py</text>
<text x="365" y="293" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ตัดสินใจ dialog policy</text>
<text x="365" y="309" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ask / recommend / chat</text>
<text x="365" y="327" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6C5CE7">PLAN_SYSTEM</text>

<rect x="490" y="250" width="210" height="88" rx="8" fill="#FBEFD9" stroke="#E8930C" stroke-width="1.4"/>
<text x="595" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9A6206">③ retriever.py</text>
<text x="595" y="293" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ค้นเวกเตอร์ + กรองงบ</text>
<text x="595" y="309" text-anchor="middle" font-size="10.5" fill="#2C2C2A">build_query (นำด้วยหมวด)</text>
<text x="595" y="327" text-anchor="middle" font-size="9.5" font-style="italic" fill="#E8930C">ใช้ bge-m3 (ไม่มี prompt)</text>

<rect x="720" y="250" width="210" height="88" rx="8" fill="#FCE9E5" stroke="#FF6B57" stroke-width="1.4"/>
<text x="825" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#C13B29">④ reranker.py</text>
<text x="825" y="293" text-anchor="middle" font-size="10.5" fill="#2C2C2A">ให้คะแนน 0–10 (ARAG)</text>
<text x="825" y="309" text-anchor="middle" font-size="10.5" fill="#2C2C2A">คัดเหลือ top 3</text>
<text x="825" y="327" text-anchor="middle" font-size="9.5" font-style="italic" fill="#FF6B57">RERANK_SYSTEM</text>
</g>

