<svg viewBox="0 0 960 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Noto Sans Thai',sans-serif" role="img" aria-label="แผนผังความเชื่อมโยงไฟล์">
<title>แผนผังความเชื่อมโยงไฟล์ — Product Rec Agent</title>
<desc>ไฟล์ในโปรเจกต์เชื่อมกันเป็นชั้น หน้าบ้าน เรียก orchestrator เรียก 5 ขั้น ทุกขั้นคุย AI ผ่าน llm.py</desc>
