<text x="480" y="196" text-anchor="middle" font-size="10.5" fill="#5B4FC0">respond(): จด → วางแผน → (3 ทาง) · ⑤ Generator + RECOMMEND/ASK/CHAT_SYSTEM อยู่ในไฟล์นี้</text>

<!-- STAGES -->
<g>
<rect x="30" y="250" width="210" height="88" rx="8" fill="#E4F5F0" stroke="#12A594" stroke-width="1.4"/>
<text x="135" y="273" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0C7A6E">① memory.py</text>
